<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Input UI</title>
    <link rel="stylesheet" href="bot.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="chat-container"></div>
    <div id="preview"> </div>
    <div class="chat-bar">
        <button class="btn" onclick="openfile()"><i class="fa-solid fa-plus"></i></button>
        <input type="file" id="fileinput" multiple style="display: none;">

        <input class="input-box" type="text" placeholder="Ask Something...">

        <div class="right-icons" id="rightIcons">
            <button class="btn" id="mic"><i class='fas'>&#xf130;</i></button>
            <button class="btn" id="voco"><i class='far'>&#xf28d;</i></button>
            <button class="btn" id="send" style="display: none;"><i class='far'>&#xf1d8;</i></button>
        </div>
    </div>


    <script src="bot.js"></script>
</body>

</html>
